services:
  postgres:
    image: postgres:17
    environment:
      # Dev-only credentials come from the repo-root .env (see .env.example); nothing is hard-coded.
      # The superuser only bootstraps; the apps use examapp_owner / examapp_app (docker/postgres/init).
      POSTGRES_DB: ${POSTGRES_DB:-examapp}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD:?set APP_DB_OWNER_PASSWORD in .env}
      APP_DB_APP_PASSWORD: ${APP_DB_APP_PASSWORD:?set APP_DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    tmpfs:
      - /piston/jobs:exec
    environment:
      # Must be >= PistonClient's RUN_TIMEOUT_MS (apps/exam-runtime/src/code-execution/piston-client.ts).
      # The stock image's own default cap (3000ms) is lower than that constant, so without this
      # override every real request is rejected by Piston itself and silently surfaces to
      # candidates as "sandbox_unavailable" — see apps/exam-runtime/src/attempts/attempt.service.ts.
      PISTON_RUN_TIMEOUT: 10000
      PISTON_COMPILE_TIMEOUT: 10000

volumes:
  postgres-data:
