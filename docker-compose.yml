services:
  postgres:
    image: postgres:17
    environment:
      # Dev-only credentials come from the repo-root .env (see .env.example); nothing is hard-coded.
      # The superuser only bootstraps; the apps use examapp_owner / examapp_app (docker/postgres/init).
      POSTGRES_DB: ${POSTGRES_DB:-examapp}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      APP_DB_OWNER_PASSWORD: ${APP_DB_OWNER_PASSWORD:?set APP_DB_OWNER_PASSWORD in .env}
      APP_DB_APP_PASSWORD: ${APP_DB_APP_PASSWORD:?set APP_DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    tmpfs:
      - /piston/jobs:exec
    environment:
      # Must be >= PistonClient's RUN_TIMEOUT_MS (apps/exam-runtime/src/code-execution/piston-client.ts).
      # The stock image's own default cap (3000ms) is lower than that constant, so without this
      # override every real request is rejected by Piston itself and silently surfaces to
      # candidates as "sandbox_unavailable" — see apps/exam-runtime/src/attempts/attempt.service.ts.
      PISTON_RUN_TIMEOUT: 10000
      PISTON_COMPILE_TIMEOUT: 10000
  # Lifecycle letters (P05 Q1, founder D4): Word -> PDF with LibreOffice inside Gotenberg. Start it with
  # `docker compose --profile letters up -d gotenberg` and set GOTENBERG_URL=http://127.0.0.1:3010 on the API.
  # No internet: the browser (Chromium) routes, webhooks and downloads from URLs are switched off, and in production
  # it runs on an internal network with no egress (the API is its only caller). Its image carries the Noto fonts
  # (Devanagari, Tamil, Telugu) the letters need.
  gotenberg:
    image: gotenberg/gotenberg:8.17.3
    profiles: ["letters"]
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --webhook-disable=true
      - --api-disable-download-from=true
      - --api-timeout=30s
      - --libreoffice-restart-after=50
    ports:
      - "127.0.0.1:3010:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
