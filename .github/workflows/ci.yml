name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway database for this job only: the container lives and dies with the runner and is
    # bound to it, so its bootstrap password is not a secret. The app/owner role passwords are
    # generated per run (see "Provision database roles").
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: examapp
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks needs real parent commits to diff against: on a push event it
          # diffs the head commit against its parent, and on a pull_request event it
          # runs `<sha>^..<sha>`, which errors on an ambiguous/missing revision under
          # the default shallow (depth-1) clone. Full history avoids both failure modes.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Unscoped: --ignore-scripts above also skips other packages' native
      # install/postinstall hooks (e.g. msgpackr-extract), not just argon2 --
      # keep this rebuilding everything rather than narrowing to one package.
      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build packages/shared
        run: npm run build --workspace=packages/shared

      # Same least-privilege layout as local docker-compose and production (README "Database"):
      # migrations run as the owner, everything else as the NOBYPASSRLS app role.
      - name: Provision database roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci-throwaway
          POSTGRES_USER: postgres
          POSTGRES_DB: examapp
        run: |
          owner_pw=$(openssl rand -hex 24); app_pw=$(openssl rand -hex 24)
          echo "::add-mask::$owner_pw"; echo "::add-mask::$app_pw"
          APP_DB_OWNER_PASSWORD=$owner_pw APP_DB_APP_PASSWORD=$app_pw sh docker/postgres/init/01-roles.sh
          echo "MIGRATION_DATABASE_URL=postgresql://examapp_owner:$owner_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://examapp_app:$app_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          # Per-run key for encrypted org secrets (SSO client secrets, TOTP secrets) used by the e2e suites.
          org_key=$(openssl rand -hex 32); echo "::add-mask::$org_key"
          echo "ORG_SECRETS_ENCRYPTION_KEY=$org_key" >> "$GITHUB_ENV"

      - name: Migrate and seed database
        working-directory: apps/api
        run: npx prisma migrate deploy && npx prisma db seed

      # Proves tenant isolation in PostgreSQL itself, connected as the app role: no context =>
      # zero rows, cross-tenant reads/writes rejected, no context leak across pooled connections,
      # and every organization_id table has forced RLS.
      - name: Database-level tenant isolation tests
        working-directory: apps/api
        run: npx jest --config ./test/jest-e2e.json rls-isolation tenant-isolation email-sender-rls soft-delete-for-tenant

      - name: Run packages/shared unit tests
        run: npm run test:shared

      - name: Run apps/api unit tests
        run: npm run test:api

      - name: Run apps/exam-runtime unit tests
        run: npm run test:exam-runtime

      # apps/web was previously neither tested nor built here. The recruiter-facing
      # proctoring log is the only surface that renders captured evidence, so a
      # regression in apps/web silently turns evidence capture into a write-only
      # feature -- exactly the defect this job now guards against.
      - name: Run apps/web unit tests
        run: npm run test:web

      # Things you can click must look clickable (founder review 7 Oct 2026): builds the yx-ui Storybook and checks a
      # representative story set (list in packages/yx-ui/scripts/check-affordance.mjs) in light and dark for text controls
      # with no border or fill, missing pointer / hover / focus ring, colour-only selected states and weak control edges.
      - name: yx-ui affordance guard
        run: |
          npx playwright install --with-deps chromium
          npm run test:affordance --workspace=packages/yx-ui

      - name: Build apps/api
        run: npm run build --workspace=apps/api

      - name: Build apps/exam-runtime
        run: npm run build --workspace=apps/exam-runtime

      # NEXT_PUBLIC_API_BASE / NEXT_PUBLIC_EXAM_RUNTIME_API_BASE are not set here on
      # purpose: every reader falls back with `??`, so this builds without secrets and
      # still catches type errors and broken imports.
      - name: Build apps/web
        run: npm run build --workspace=apps/web

      - name: Dependency audit report (all severities, informational)
        run: npm audit || true

      - name: Dependency audit gate (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
