name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks needs real parent commits to diff against: on a push event it
          # diffs the head commit against its parent, and on a pull_request event it
          # runs `<sha>^..<sha>`, which errors on an ambiguous/missing revision under
          # the default shallow (depth-1) clone. Full history avoids both failure modes.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Unscoped: --ignore-scripts above also skips other packages' native
      # install/postinstall hooks (e.g. msgpackr-extract), not just argon2 --
      # keep this rebuilding everything rather than narrowing to one package.
      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build packages/shared
        run: npm run build --workspace=packages/shared

      - name: Run packages/shared unit tests
        run: npm run test:shared

      - name: Run apps/api unit tests
        run: npm run test:api

      - name: Run apps/exam-runtime unit tests
        run: npm run test:exam-runtime

      # apps/web was previously neither tested nor built here. The recruiter-facing
      # proctoring log is the only surface that renders captured evidence, so a
      # regression in apps/web silently turns evidence capture into a write-only
      # feature -- exactly the defect this job now guards against.
      - name: Run apps/web unit tests
        run: npm run test:web

      - name: Build apps/api
        run: npm run build --workspace=apps/api

      - name: Build apps/exam-runtime
        run: npm run build --workspace=apps/exam-runtime

      # NEXT_PUBLIC_API_BASE / NEXT_PUBLIC_EXAM_RUNTIME_API_BASE are not set here on
      # purpose: every reader falls back with `??`, so this builds without secrets and
      # still catches type errors and broken imports.
      - name: Build apps/web
        run: npm run build --workspace=apps/web

      - name: Dependency audit report (all severities, informational)
        run: npm audit || true

      - name: Dependency audit gate (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
