name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway database for this job only: the container lives and dies with the runner and is
    # bound to it, so its bootstrap password is not a secret. The app/owner role passwords are
    # generated per run (see "Provision database roles").
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: examapp
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks needs real parent commits to diff against: on a push event it
          # diffs the head commit against its parent, and on a pull_request event it
          # runs `<sha>^..<sha>`, which errors on an ambiguous/missing revision under
          # the default shallow (depth-1) clone. Full history avoids both failure modes.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      # Unscoped: --ignore-scripts above also skips other packages' native
      # install/postinstall hooks (e.g. msgpackr-extract), not just argon2 --
      # keep this rebuilding everything rather than narrowing to one package.
      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build packages/shared
        run: npm run build --workspace=packages/shared

      # Same least-privilege layout as local docker-compose and production (README "Database"):
      # migrations run as the owner, everything else as the NOBYPASSRLS app role.
      - name: Provision database roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci-throwaway
          POSTGRES_USER: postgres
          POSTGRES_DB: examapp
        run: |
          owner_pw=$(openssl rand -hex 24); app_pw=$(openssl rand -hex 24)
          echo "::add-mask::$owner_pw"; echo "::add-mask::$app_pw"
          APP_DB_OWNER_PASSWORD=$owner_pw APP_DB_APP_PASSWORD=$app_pw sh docker/postgres/init/01-roles.sh
          echo "MIGRATION_DATABASE_URL=postgresql://examapp_owner:$owner_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://examapp_app:$app_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          # Per-run key for encrypted org secrets (SSO client secrets, TOTP secrets) used by the e2e suites.
          org_key=$(openssl rand -hex 32); echo "::add-mask::$org_key"
          echo "ORG_SECRETS_ENCRYPTION_KEY=$org_key" >> "$GITHUB_ENV"

      - name: Migrate and seed database
        working-directory: apps/api
        run: npx prisma migrate deploy && npx prisma db seed

      # Proves tenant isolation in PostgreSQL itself, connected as the app role: no context =>
      # zero rows, cross-tenant reads/writes rejected, no context leak across pooled connections,
      # and every organization_id table has forced RLS.
      - name: Database-level tenant isolation tests
        working-directory: apps/api
        run: npx jest --config ./test/jest-e2e.json rls-isolation tenant-isolation email-sender-rls soft-delete-for-tenant

      - name: Run packages/shared unit tests
        run: npm run test:shared

      - name: Run apps/api unit tests
        run: npm run test:api

      - name: Run apps/exam-runtime unit tests
        run: npm run test:exam-runtime

      # apps/web was previously neither tested nor built here. The recruiter-facing
      # proctoring log is the only surface that renders captured evidence, so a
      # regression in apps/web silently turns evidence capture into a write-only
      # feature -- exactly the defect this job now guards against.
      - name: Run apps/web unit tests
        run: npm run test:web

      - name: Run packages/yx-ui unit tests
        run: npm run test --workspace=packages/yx-ui

      # Things you can click must look clickable (founder review 7 Oct 2026): builds the yx-ui Storybook and checks a
      # representative story set (list in packages/yx-ui/scripts/check-affordance.mjs) in light and dark for text controls
      # with no border or fill, missing pointer / hover / focus ring, colour-only selected states and weak control edges.
      - name: yx-ui affordance guard
        run: |
          npx playwright install --with-deps chromium
          npm run test:affordance --workspace=packages/yx-ui

      - name: Build apps/api
        run: npm run build --workspace=apps/api

      - name: Build apps/exam-runtime
        run: npm run build --workspace=apps/exam-runtime

      # NEXT_PUBLIC_API_BASE / NEXT_PUBLIC_EXAM_RUNTIME_API_BASE are not set here on
      # purpose: every reader falls back with `??`, so this builds without secrets and
      # still catches type errors and broken imports.
      - name: Build apps/web
        run: npm run build --workspace=apps/web

      - name: Dependency audit report (all severities, informational)
        run: npm audit || true

      - name: Dependency audit gate (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every apps/api e2e suite, split across shards so wall time stays near 15 minutes. Each shard is
  # its own job, so it gets its own Postgres/Redis service containers and a fresh, freshly seeded database.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: examapp
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build packages/shared
        run: npm run build --workspace=packages/shared

      - name: Provision database roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci-throwaway
          POSTGRES_USER: postgres
          POSTGRES_DB: examapp
        run: |
          owner_pw=$(openssl rand -hex 24); app_pw=$(openssl rand -hex 24)
          echo "::add-mask::$owner_pw"; echo "::add-mask::$app_pw"
          APP_DB_OWNER_PASSWORD=$owner_pw APP_DB_APP_PASSWORD=$app_pw sh docker/postgres/init/01-roles.sh
          echo "MIGRATION_DATABASE_URL=postgresql://examapp_owner:$owner_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://examapp_app:$app_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          # The suites boot the whole AppModule, which signs tokens: per-run secrets, never stored anywhere.
          for name in ORG_SECRETS_ENCRYPTION_KEY JWT_ACCESS_SECRET JWT_REFRESH_SECRET CANDIDATE_JWT_ACCESS_SECRET CANDIDATE_JWT_REFRESH_SECRET INTERNAL_SERVICE_SECRET; do
            value=$(openssl rand -hex 32); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "API_ORIGIN=http://localhost:3001" >> "$GITHUB_ENV"
          echo "WEB_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"

      - name: Migrate and seed database
        working-directory: apps/api
        run: npx prisma migrate deploy && npx prisma db seed

      - name: API e2e suites (shard ${{ matrix.shard }}/4)
        working-directory: apps/api
        run: npx jest --config ./test/jest-e2e.json --shard=${{ matrix.shard }}/4

  # A fresh database takes every migration in order, and Prisma then reports it up to date (no failed, missing or
  # edited migrations). The diff guard fails when schema.prisma has a table, column or index no migration creates.
  # It ignores what the migrations add on purpose beyond the Prisma schema (tenant foreign keys, RLS, raw-SQL
  # defaults and index names), which Prisma reports as removals or changes, never as additions.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: examapp
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Provision database roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci-throwaway
          POSTGRES_USER: postgres
          POSTGRES_DB: examapp
        run: |
          owner_pw=$(openssl rand -hex 24); app_pw=$(openssl rand -hex 24)
          echo "::add-mask::$owner_pw"; echo "::add-mask::$app_pw"
          APP_DB_OWNER_PASSWORD=$owner_pw APP_DB_APP_PASSWORD=$app_pw sh docker/postgres/init/01-roles.sh
          echo "MIGRATION_DATABASE_URL=postgresql://examapp_owner:$owner_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://examapp_app:$app_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"

      - name: Deploy every migration to an empty database
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Migration status reports no drift
        working-directory: apps/api
        run: npx prisma migrate status

      - name: No model or column without a migration
        working-directory: apps/api
        run: |
          npx prisma migrate diff --from-url "$MIGRATION_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma > schema-diff.txt
          if grep -E '^\s*\[\+\]' schema-diff.txt; then
            echo "::error::schema.prisma has the additions above that no migration creates. Run prisma migrate dev to add one."
            exit 1
          fi
          echo "No additions: every model, column and index in schema.prisma comes from a migration."

  # yx-ui Storybook: a screenshot of every story in light and dark (visual.spec.ts; Linux baselines in
  # packages/yx-ui/tests/__screenshots__/linux, Git LFS) and a WCAG 2.2 AA axe scan of each (a11y.spec.ts).
  # Refreshing the Linux baselines after an intended UI change: packages/yx-ui/tests/README.md.
  yx-ui:
    name: yx-ui ${{ matrix.suite }} (shard ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: visual, shard: 1, of: 1 }
          - { suite: a11y, shard: 1, of: 4 }
          - { suite: a11y, shard: 2, of: 4 }
          - { suite: a11y, shard: 3, of: 4 }
          - { suite: a11y, shard: 4, of: 4 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: ${{ matrix.suite == 'visual' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build Storybook
        working-directory: packages/yx-ui
        run: npx storybook build --quiet

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook ${{ matrix.suite }} tests (shard ${{ matrix.shard }}/${{ matrix.of }})
        working-directory: packages/yx-ui
        run: npx playwright test tests/${{ matrix.suite }}.spec.ts --shard=${{ matrix.shard }}/${{ matrix.of }}

      - name: Upload the results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: yx-ui-${{ matrix.suite }}-${{ matrix.shard }}
          # test-results has the diffs; __screenshots__/linux has any baseline Playwright wrote because it was missing.
          path: |
            packages/yx-ui/test-results
            packages/yx-ui/tests/__screenshots__/linux
          retention-days: 7

  # The apps/web Playwright walk-throughs against the built API, exam runtime and web app (scripts/e2e-stack.sh)
  # on a freshly migrated and seeded database with Redis. Each shard is its own job with its own database.
  web-e2e:
    name: web-e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: examapp
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examapp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      E2E_WEB_PORT: 3620
      E2E_API_PORT: 3621
      E2E_RUNTIME_PORT: 3623
      WEB_BASE_URL: http://localhost:3620
      NEXT_PUBLIC_API_BASE: http://localhost:3621/api/v1
      NEXT_PUBLIC_EXAM_RUNTIME_API_BASE: http://localhost:3623/api/v1
      E2E_API_BASE: http://localhost:3621/api/v1
      E2E_API_ORIGIN: http://localhost:3621
      E2E_REDIS_URL: redis://localhost:6379
      E2E_DEV_DNS: /tmp/yx-desk-e2e-dns.json
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Rebuild native dependencies
        run: npm rebuild

      - name: Build packages/shared
        run: npm run build --workspace=packages/shared

      - name: Provision database roles
        env:
          PGHOST: localhost
          PGPASSWORD: ci-throwaway
          POSTGRES_USER: postgres
          POSTGRES_DB: examapp
        run: |
          owner_pw=$(openssl rand -hex 24); app_pw=$(openssl rand -hex 24)
          echo "::add-mask::$owner_pw"; echo "::add-mask::$app_pw"
          APP_DB_OWNER_PASSWORD=$owner_pw APP_DB_APP_PASSWORD=$app_pw sh docker/postgres/init/01-roles.sh
          echo "MIGRATION_DATABASE_URL=postgresql://examapp_owner:$owner_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://examapp_app:$app_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=postgresql://examapp_app:$app_pw@localhost:5432/examapp?schema=public" >> "$GITHUB_ENV"
          for name in ORG_SECRETS_ENCRYPTION_KEY JWT_ACCESS_SECRET JWT_REFRESH_SECRET CANDIDATE_JWT_ACCESS_SECRET CANDIDATE_JWT_REFRESH_SECRET INTERNAL_SERVICE_SECRET; do
            value=$(openssl rand -hex 32); echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Migrate and seed database
        working-directory: apps/api
        run: npx prisma migrate deploy && npx prisma db seed

      - name: Build the API, exam runtime and web app
        run: |
          npm run build --workspace=apps/api
          npm run build --workspace=apps/exam-runtime
          npm run build --workspace=apps/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: sh scripts/e2e-stack.sh

      - name: Walk-throughs (shard ${{ matrix.shard }}/4)
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload logs and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-${{ matrix.shard }}
          path: |
            e2e-logs
            apps/web/test-results
          retention-days: 7
