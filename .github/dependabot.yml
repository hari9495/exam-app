version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only patch/minor version bumps. Major bumps (React 19, Prisma 7, ioredis 6, …)
    # are breaking migrations we take on deliberately, not via auto-PRs. Security
    # updates are unaffected by this ignore and still open regardless of semver.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
